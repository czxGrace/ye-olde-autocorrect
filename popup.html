<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "OldeBlackletter"; src: url("fonts/blackletter.woff2") format("woff2"); }
  body { width: 280px; min-height: 260px; margin: 0; padding: 16px; background: #f3e3b8; color: #4a2c0a;
         font: 13px/1.4 Georgia, serif; position: relative; overflow: hidden;
         box-shadow: inset 0 0 40px rgba(90,50,10,.35); }
  h1 { font-family: "OldeBlackletter", serif; font-weight: 400; font-size: 26px; margin: 0 0 10px; }
  label { display: block; margin: 12px 0 4px; }
  input[type=range] { width: 100%; accent-color: #7a4a14; }
  .btn { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #7a4a14; border-radius: 6px;
         background: #fff8e6; color: #4a2c0a; font: inherit; cursor: pointer; }
  .btn.small { background: transparent; border-style: dashed; font-size: 12px; }
  .count { margin-top: 12px; font-style: italic; }

  .dialog { position: absolute; inset: 0; background: rgba(20,10,2,.55); display: none; }
  .dialog.open { display: block; }
  .scroll { position: absolute; left: 14px; right: 14px; top: 40px; padding: 18px 16px 70px;
            background: #f6e7bf; border: 2px solid #5c3a10; border-radius: 4px; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.5), inset 0 0 30px rgba(120,70,20,.35); }
  .scroll::before, .scroll::after { content: ""; position: absolute; left: -8px; right: -8px; height: 12px;
            background: #c9a35f; border: 2px solid #5c3a10; border-radius: 8px; }
  .scroll::before { top: -10px; }
  .scroll::after { bottom: -10px; }
  .q { font-family: "OldeBlackletter", serif; font-size: 23px; line-height: 1.25; }
  .choice { position: absolute; padding: 7px 18px; border: 1px solid #5c3a10; border-radius: 4px;
            background: #fff8e6; color: #4a2c0a; font: 15px Georgia, serif; cursor: pointer;
            transition: left .15s, top .15s; }
  #yea { left: 70px; top: 190px; }
  #nay { left: 160px; top: 190px; }
  .verdict { position: absolute; left: 0; right: 0; top: 230px; text-align: center; color: #f3e3b8;
             font-family: "OldeBlackletter", serif; font-size: 20px; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
  <h1>Ye Olde Autocorrect</h1>
  <label>Chaos: <span id="val"></span></label>
  <input type="range" id="chaos" min="0" max="100">
  <button class="btn" id="off">Turn off</button>
  <button class="btn small" id="scrub">Scrub the parchment (reset page decay)</button>
  <div class="count" id="count"></div>

  <div class="dialog" id="dialog">
    <div class="scroll"><div class="q">Wouldst thou truly forsake the olde tongue?</div></div>
    <button class="choice" id="yea">Yea</button>
    <button class="choice" id="nay">Nay</button>
    <div class="verdict" id="verdict"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
